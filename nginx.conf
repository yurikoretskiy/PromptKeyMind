server {
    listen 80;
    server_name type.yurykoretskiy.space;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Revalidate executable and presentation assets during active testing.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Cache only content-addressed or rarely changing media assets.
    location ~* \.(woff2|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
